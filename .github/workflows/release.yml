name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(awk '/^\[mod\]/{found=1} found && /^version *=/{print; exit}' stonecutter.properties.toml | cut -d'"' -f2)
          FULL_VERSION="${VERSION}"

          echo "Validating tag '$TAG' against version '$FULL_VERSION'..."
          if [[ "$TAG" != "$FULL_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match version '$FULL_VERSION' in stonecutter.properties.toml."

            if gh release view "$TAG" &>/dev/null; then
              echo "Deleting GitHub release for $TAG..."
              gh release delete "$TAG" -y
            fi

            git push origin ":refs/tags/$TAG"
            exit 1
          fi
          echo "✓ Tag matches version."

  build:
    needs: validate
    uses: ./.github/workflows/build_reusable.yml
    with:
      release: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    env:
      MOD_IS_RELEASE: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
      PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
      PUB_MAVEN_ENABLE: ${{ vars.PUB_MAVEN_ENABLE }}
      PUB_MAVEN_CENTRAL_ENABLE: ${{ vars.PUB_MAVEN_CENTRAL_ENABLE }}
      PUB_MAVEN_CENTRAL_SNAPSHOTS: ${{ vars.PUB_MAVEN_CENTRAL_SNAPSHOTS }}
      PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
      PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}
      PUB_CURSEFORGE_PROJECT_ID: ${{ vars.PUB_CURSEFORGE_PROJECT_ID }}
      PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
      PUB_CURSEFORGE_TOKEN: ${{ secrets.PUB_CURSEFORGE_TOKEN }}
      PUB_SIGNING_KEY: ${{ secrets.PUB_SIGNING_KEY }}
      PUB_SIGNING_ID: ${{ secrets.PUB_SIGNING_ID }}
      PUB_SIGNING_PASSWORD: ${{ secrets.PUB_SIGNING_PASSWORD }}
      PUB_MAVEN_CENTRAL_USERNAME: ${{ secrets.PUB_MAVEN_CENTRAL_USERNAME }}
      PUB_MAVEN_CENTRAL_PASSWORD: ${{ secrets.PUB_MAVEN_CENTRAL_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Publish
        run: ./gradlew publishMods --stacktrace
